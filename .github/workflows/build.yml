name: Build Android APK (Debug - Clean Mode)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🧹【第一道防线】清理网页资源
      - name: Clean Old Web Assets
        run: rm -rf android/app/src/main/assets/public/*

      - name: Sync Capacitor
        run: npx cap sync android

      # 💣【核心防线 - 你的猜测对应方案】
      # 在打包前，强制删除整个 build 目录！
      # 这能证明：如果后面生成了 APK，那绝对是刚才现做出来的，绝不可能是旧的。
      - name: Nuke Build Folder
        run: rm -rf android/app/build

      # 🔨【构建步骤】
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          # 再次加上 clean 双重保险
          ./gradlew clean assembleDebug

      # 🕵️【验尸步骤】检查生成时间
      # 如果这里打印的时间不是当前几秒内的，那就是见鬼了
      - name: Check APK Timestamp
        run: |
          echo "APK 生成时间："
          ls -l android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk "App Preview.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App Preview
          path: "App Preview.apk"